<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小菠萝-Music</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --pine-yellow:#FFD166;
      --soft-pink:#FFB6C1;
      --main:#222;
      --bg:#fffdf9;
      --card:#ffffff;
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
    body{background:var(--bg);color:var(--main);padding:16px;padding-bottom:90px;}
    header{text-align:center;margin-bottom:24px;}
    header h1{color:#2c3e50;font-size:28px;}
    .status{font-size:14px;margin-top:6px;}
    .tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;}
    .tab{padding:10px 14px;background:#f3f3f3;border-radius:99px;white-space:nowrap;border:none;cursor:pointer;font-size:15px;}
    .tab.active{background:var(--pine-yellow);font-weight:bold;}
    .search-wrap{margin-bottom:16px;}
    .search-input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid #ddd;font-size:16px;}
    .card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #00000010;}
    .card-title{font-weight:bold;margin-bottom:4px;}
    .card small{color:#666;}
    .manage-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
    .btn{padding:8px 12px;border-radius:10px;border:none;cursor:pointer;font-size:14px;}
    .btn-manage{background:#444;color:white;}
    .btn-danger{background:#ef4444;color:white;}
    .fab{position:fixed;right:20px;bottom:20px;width:52px;height:52px;border-radius:50%;background:var(--pine-yellow);border:none;font-size:22px;box-shadow:0 3px 10px #00000022;cursor:pointer;}
    .modal{position:fixed;inset:0;background:#00000070;display:flex;align-items:center;justify-content:center;padding:16px;z:100;}
    .modal-box{background:white;border-radius:18px;padding:20px;width:100%;max-width:500px;max-height:85vh;overflow:auto;}
    .modal-box h3{margin-bottom:16px;}
    .form-item{margin-bottom:12px;}
    .form-item label{display:block;margin-bottom:4px;font-size:14px;}
    .form-item input,.form-item textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;font-size:16px;}
    .modal-footer{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(140px,1fr));gap:12px;}
    .media-item{border-radius:12px;overflow:hidden;background:white;box-shadow:0 2px 6px #00000010;}
    .media-item img{width:100%;aspect-ratio:1/1;object-fit:cover;cursor:pointer;}
    .media-item .name{padding:8px;font-size:14px;}
    .media-item .actions{padding:0 8px 8px;display:flex;gap:6px;}
    .media-item .actions button{font-size:12px;padding:4px 6px;}
    .lightbox{position:fixed;inset:0;background:#000000dd;display:none;align-items:center;justify-content:center;z:200;padding:20px;}
    .lightbox img{max-width:100%;max-height:100%;cursor:pointer;}
    .page{display:none;}
    .page.active{display:block;}
    audio,video{width:100%;border-radius:10px;margin:6px 0;}
    .tip{color:#777;font-size:13px;margin:8px 0;}
  </style>
</head>
<body>
<header>
  <h1>🍍小菠萝-Music</h1>
  <div class="status" id="connStatus">正在连接云端...</div>
</header>

<div class="tabs">
  <button class="tab active" data-target="records">📝课程记录</button>
  <button class="tab" data-target="scores">🎼谱子图片</button>
  <button class="tab" data-target="videos">🎬伴奏视频</button>
  <button class="tab" data-target="audios">🎧伴奏音频</button>
</div>

<!-- 课程记录页 -->
<div class="page active" id="records">
  <div class="search-wrap">
    <input class="search-input" placeholder="搜索课程记录..." id="searchRecords">
  </div>
  <div class="manage-bar">
    <div></div>
    <button class="btn btn-manage" id="manageRecords">管理</button>
  </div>
  <div id="recordsList"></div>
</div>

<!-- 谱子页 -->
<div class="page" id="scores">
  <div class="search-wrap">
    <input class="search-input" placeholder="搜索谱子名称..." id="searchScores">
  </div>
  <div class="manage-bar">
    <div></div>
    <button class="btn btn-manage" id="manageScores">管理</button>
  </div>
  <div class="grid" id="scoresList"></div>
</div>

<!-- 视频页 -->
<div class="page" id="videos">
  <div class="search-wrap">
    <input class="search-input" placeholder="搜索伴奏视频..." id="searchVideos">
  </div>
  <div class="manage-bar">
    <div></div>
    <button class="btn btn-manage" id="manageVideos">管理</button>
  </div>
  <div id="videosList"></div>
</div>

<!-- 音频页 -->
<div class="page" id="audios">
  <div class="search-wrap">
    <input class="search-input" placeholder="搜索伴奏音频..." id="searchAudios">
  </div>
  <div class="manage-bar">
    <div></div>
    <button class="btn btn-manage" id="manageAudios">管理</button>
  </div>
  <div id="audiosList"></div>
</div>

<!-- 右下角悬浮按钮 -->
<button class="fab" id="fabBtn">+</button>

<!-- 图片放大弹窗 -->
<div class="lightbox" id="lightbox">
  <img id="lightImg">
</div>

<!-- 新增/编辑表单弹窗 -->
<div id="modalWrap"></div>

<script>
// ========== Supabase配置（你的信息）==========
const SUPABASE_URL = "https://ixldmkdcnhejmtjpgawm.supabase.co";
const SUPABASE_KEY = "sb_publishable_ntl8P9fwJxo3QAf_EkqAnQ_nD8KJEkq";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 全局状态
let currentTab = "records";
let manageMode = {records:false,scores:false,videos:false,audios:false};

// Tab切换
document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    const target = tab.dataset.target;
    currentTab = target;
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(target).classList.add("active");
    updateFabIcon();
    loadAllData();
  }
})
function updateFabIcon(){
  const fab = document.getElementById("fabBtn");
  const map = {records:"📝",scores:"🖼️",videos:"🎬",audios:"🎧"};
  fab.innerText = map[currentTab];
}
updateFabIcon();

// 云端连接检测
(async function testConn(){
  const {error} = await supabase.from("records").select("id").limit(1);
  const el = document.getElementById("connStatus");
  if(error){
    el.innerHTML = "❌云端连接失败，请检查Supabase配置";
    el.style.color="red";
  }else{
    el.innerHTML = "☁️云端已连接";
    el.style.color="#209950";
  }
})();

// Fab按钮弹窗
document.getElementById("fabBtn").onclick = async ()=>{
  if(currentTab === "records"){
    openRecordModal();
  }else{
    openFileUploadModal();
  }
}

// 管理按钮开关
document.getElementById("manageRecords").onclick = ()=>{manageMode.records=!manageMode.records;loadAllData();}
document.getElementById("manageScores").onclick = ()=>{manageMode.scores=!manageMode.scores;loadAllData();}
document.getElementById("manageVideos

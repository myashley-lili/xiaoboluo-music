<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小菠萝的音乐课堂</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            background: linear-gradient(180deg, #FFF0F5 0%, #F0F8FF 100%);
            min-height: 100vh; color: #333; overflow-x: hidden;
        }
        .top-nav {
            background: #fff; height: 56px; display: flex; align-items: center;
            justify-content: space-between; padding: 0 16px; position: sticky; top: 0; z-index: 100;
        }
        .nav-btn {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer; border: none; background: none; color: #333;
        }
        .nav-title { font-size: 18px; font-weight: 700; color: #333; display: flex; align-items: center; gap: 4px; }
        .cloud-badge {
            font-size: 11px; background: #E8F5E9; color: #43A047; padding: 3px 8px;
            border-radius: 10px; font-weight: 600; margin-left: 6px;
        }
        .header-banner {
            background: linear-gradient(135deg, #FFD93D 0%, #FF9A8B 50%, #FFA07A 100%);
            padding: 30px 20px 50px; text-align: center; position: relative; overflow: hidden; border-radius: 0 0 30px 30px;
        }
        .music-note { position: absolute; opacity: 0.15; font-size: 60px; color: #8B4513; }
        .note-1 { top: 20px; left: 20px; transform: rotate(-15deg); }
        .note-2 { top: 40px; right: 30px; font-size: 80px; transform: rotate(10deg); }
        .note-3 { bottom: 30px; left: 40px; font-size: 50px; transform: rotate(5deg); }
        .avatar-circle {
            width: 110px; height: 110px; border-radius: 50%; background: #fff; margin: 0 auto 18px;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden; position: relative; z-index: 2;
        }
        .avatar-placeholder { font-size: 60px; }
        .banner-title {
            font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.1); position: relative; z-index: 2;
        }
        .banner-subtitle {
            font-size: 14px; color: rgba(255,255,255,0.95); display: flex; align-items: center;
            justify-content: center; gap: 6px; position: relative; z-index: 2;
        }
        .tab-nav {
            background: #fff; margin: -25px 16px 0; border-radius: 16px; display: flex; padding: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); position: relative; z-index: 10;
        }
        .tab-item {
            flex: 1; text-align: center; padding: 12px 4px; cursor: pointer; border-radius: 12px;
            transition: all 0.3s; position: relative;
        }
        .tab-item .tab-icon { font-size: 28px; margin-bottom: 4px; display: block; }
        .tab-item .tab-label { font-size: 13px; color: #999; font-weight: 500; }
        .tab-item.active .tab-label { color: #FF6B9D; font-weight: 700; }
        .tab-item.active::after {
            content: ""; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
            width: 30px; height: 3px; background: #FF6B9D; border-radius: 2px;
        }
        .stats-inline {
            margin: 0 16px 12px;
            font-size: 13px;
            color: #FF8C69;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }
        .stats-inline .num { font-size: 16px; font-weight: 800; }
        .io-buttons { display: flex; gap: 8px; }
        .io-btn {
            padding: 5px 12px; border: none; border-radius: 12px; font-size: 12px;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .io-btn-export { background: #FFF3E0; color: #FF8C69; }
        .io-btn-export:active { background: #FFE0B2; }
        .io-btn-import { background: #E8F5E9; color: #43A047; }
        .io-btn-import:active { background: #C8E6C9; }
        .search-box {
            margin: 16px; background: #fff; border-radius: 16px; padding: 14px 16px;
            display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        .search-box .search-icon { font-size: 18px; opacity: 0.4; }
        .search-box input { flex: 1; border: none; outline: none; font-size: 15px; color: #333; background: transparent; }
        .search-box input::placeholder { color: #ccc; }
        .content-area { padding: 0 16px; min-height: 300px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .empty-state { text-align: center; padding: 50px 20px 30px; }
        .empty-icon { font-size: 60px; margin-bottom: 20px; opacity: 0.6; }
        .empty-text { font-size: 15px; color: #ccc; line-height: 1.6; }
        .loading-state { text-align: center; padding: 60px 20px; }
        .loading-spinner {
            width: 40px; height: 40px; border: 3px solid #FFE082; border-top-color: #FF8C69;
            border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .lesson-card {
            background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04); position: relative;
        }
        .lesson-card .lesson-date {
            font-size: 12px; color: #FF8C69; font-weight: 600; margin-bottom: 6px;
        }
        .lesson-card .lesson-title {
            font-size: 16px; font-weight: 700; color: #333; margin-bottom: 8px;
        }
        .lesson-card .lesson-content {
            font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 8px;
        }
        .lesson-card .lesson-homework {
            background: #FFF3E0; border-radius: 10px; padding: 10px 12px; margin-top: 8px;
        }
        .lesson-card .homework-label { font-size: 12px; color: #FF8C69; font-weight: 700; margin-bottom: 4px; }
        .lesson-card .homework-text { font-size: 13px; color: #E65100; line-height: 1.5; }
        .lesson-card .lesson-tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
        .lesson-card .tag {
            font-size: 11px; background: #FCE4EC; color: #FF6B9D; padding: 3px 8px; border-radius: 8px; font-weight: 500;
        }
        .lesson-card .card-actions {
            position: absolute; top: 12px; right: 12px; display: flex; gap: 6px;
        }
        .card-action-btn {
            width: 28px; height: 28px; border: none; background: #F5F5F5; border-radius: 8px;
            font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .sheet-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding-bottom: 20px;
        }
        .sheet-card {
            background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            position: relative;
        }
        .sheet-thumb {
            width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #F5F5F5; cursor: pointer;
        }
        .sheet-info { padding: 10px 12px; }
        .sheet-title { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 2px; }
        .sheet-date { font-size: 11px; color: #999; }
        .sheet-delete {
            position: absolute; top: 8px; right: 8px; width: 26px; height: 26px;
            background: rgba(0,0,0,0.5); color: #fff; border: none; border-radius: 50%;
            font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .media-card {
            background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        .media-card .media-title { font-size: 15px; font-weight: 700; color: #333; margin-bottom: 6px; }
        .media-card .media-desc { font-size: 13px; color: #666; margin-bottom: 10px; line-height: 1.5; }
        .media-card video, .media-card audio { width: 100%; border-radius: 8px; }
        .media-card .media-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
        .delete-btn {
            padding: 5px 12px; background: #FFEBEE; color: #E53935; border: none;
            border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer;
        }
        .fab {
            position: fixed; bottom: 80px; right: 20px; width: 56px; height: 56px;
            background: linear-gradient(135deg, #FF6B9D, #FF8C69); color: #fff; border: none;
            border-radius: 50%; font-size: 28px; cursor: pointer; box-shadow: 0 4px 20px rgba(255,107,157,0.4);
            display: flex; align-items: center; justify-content: center; z-index: 50;
            transition: transform 0.2s;
        }
        .fab:active { transform: scale(0.95); }
        .footer {
            text-align: center; padding: 30px 20px 100px; font-size: 14px; color: #FF8C69; font-weight: 600;
        }
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5);
            display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #fff; border-radius: 20px; width: 100%; max-width: 400px;
            max-height: 85vh; overflow-y: auto; padding: 24px; position: relative;
        }
        .modal-close {
            position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
            background: #F5F5F5; border: none; border-radius: 50%; font-size: 18px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; color: #666;
        }
        .modal-title { font-size: 20px; font-weight: 800; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-input, .form-textarea, .form-select {
            width: 100%; padding: 12px 14px; border: 1.5px solid #E0E0E0; border-radius: 12px;
            font-size: 14px; color: #333; outline: none; transition: border-color 0.2s;
            font-family: inherit;
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: #FF6B9D; }
        .form-textarea { min-height: 80px; resize: vertical; }
        .submit-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #FF6B9D, #FF8C69);
            color: #fff; border: none; border-radius: 14px; font-size: 16px; font-weight: 700;
            cursor: pointer; margin-top: 8px;
        }
        .upload-area {
            border: 2px dashed #FFB6C1; border-radius: 14px; padding: 30px 20px; text-align: center;
            cursor: pointer; transition: all 0.2s; background: #FFF5F8;
        }
        .upload-area:active { background: #FFE4EC; }
        .upload-icon { font-size: 40px; margin-bottom: 10px; }
        .upload-text { font-size: 14px; color: #FF6B9D; font-weight: 600; }
        .upload-hint { font-size: 12px; color: #999; margin-top: 4px; }
        .sheet-viewer {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9);
            display: none; align-items: center; justify-content: center; z-index: 300;
        }
        .sheet-viewer.active { display: flex; }
        .sheet-viewer img {
            max-width: 100%; max-height: 100%; object-fit: contain;
            touch-action: none; transition: transform 0.1s;
        }
        .sheet-viewer-close {
            position: absolute; top: 20px; right: 20px; width: 40px; height: 40px;
            background: rgba(255,255,255,0.2); color: #fff; border: none; border-radius: 50%;
            font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 301;
        }
        .toast {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 20px;
            font-size: 14px; z-index: 500; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }
        .hidden-input { display: none; }
    </style>
</head>
<body>
    <div class="top-nav">
        <button class="nav-btn">🎵</button>
        <div class="nav-title">小菠萝的音乐课堂<span class="cloud-badge" id="cloudBadge" title="点击查看连接状态" onclick="showConnectionInfo()">☁️ 云端同步</span></div>
        <button class="nav-btn">🍍</button>
    </div>

    <div class="header-banner">
        <div class="music-note note-1">♪</div>
        <div class="music-note note-2">♫</div>
        <div class="music-note note-3">♪</div>
        <div class="avatar-circle"><img src="https://aka.doubaocdn.com/s/WmZfQLnIpG" alt="小菠萝" style="width:100%;height:100%;object-fit:cover;"></div>
        <div class="banner-title">小菠萝的音乐课堂</div>
        <div class="banner-subtitle">🎵记录每一次成长，珍藏每一段旋律🎵</div>
    </div>

    <div class="tab-nav">
        <div class="tab-item active" onclick="switchTab('lessons')">
            <span class="tab-icon">📝</span>
            <span class="tab-label">课程记录</span>
        </div>
        <div class="tab-item" onclick="switchTab('sheets')">
            <span class="tab-icon">🎼</span>
            <span class="tab-label">谱子图片</span>
        </div>
        <div class="tab-item" onclick="switchTab('videos')">
            <span class="tab-icon">🎬</span>
            <span class="tab-label">伴奏视频</span>
        </div>
        <div class="tab-item" onclick="switchTab('audios')">
            <span class="tab-icon">🎧</span>
            <span class="tab-label">伴奏音频</span>
        </div>
    </div>

    <div class="content-area">
        <div class="tab-content active" id="tab-lessons">
            <div class="stats-inline">
                <span>📚 累计课时：<span class="num" id="totalLessons">0</span> 节</span>
                <div class="io-buttons">
                    <button class="io-btn io-btn-export" onclick="exportLessons()">📤 导出</button>
                    <button class="io-btn io-btn-import" onclick="document.getElementById('importFile').click()">📥 导入</button>
                </div>
            </div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="lessonSearch" placeholder="搜索课程记录..." oninput="renderLessons()">
            </div>
            <div id="lessonList"></div>
        </div>

        <div class="tab-content" id="tab-sheets">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="sheetSearch" placeholder="搜索谱子..." oninput="renderSheets()">
            </div>
            <div class="sheet-grid" id="sheetList"></div>
        </div>

        <div class="tab-content" id="tab-videos">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="videoSearch" placeholder="搜索视频..." oninput="renderVideos()">
            </div>
            <div id="videoList"></div>
        </div>

        <div class="tab-content" id="tab-audios">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="audioSearch" placeholder="搜索音频..." oninput="renderAudios()">
            </div>
            <div id="audioList"></div>
        </div>
    </div>

    <button class="fab" onclick="openAddModal()">+</button>

    <div class="footer">🍍 小菠萝快乐唱歌，快乐成长</div>

    <!-- 新增/编辑弹窗 -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <button class="modal-close" onclick="closeAddModal()">✕</button>
            <div class="modal-title" id="modalTitle">新增课程记录</div>
            <div id="lessonForm">
                <div class="form-group">
                    <label class="form-label">日期</label>
                    <input type="date" class="form-input" id="lessonDate">
                </div>
                <div class="form-group">
                    <label class="form-label">课程标题</label>
                    <input type="text" class="form-input" id="lessonTitle" placeholder="例如：第3课 - 小星星">
                </div>
                <div class="form-group">
                    <label class="form-label">课程内容</label>
                    <textarea class="form-textarea" id="lessonContent" placeholder="记录今天学了什么..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">课后作业</label>
                    <textarea class="form-textarea" id="lessonHomework" placeholder="今天的作业是..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">标签（用逗号分隔）</label>
                    <input type="text" class="form-input" id="lessonTags" placeholder="例如：声乐,练习曲">
                </div>
                <button class="submit-btn" onclick="saveLesson()">保存</button>
            </div>
            <div id="sheetForm" style="display:none;">
                <div class="form-group">
                    <label class="form-label">谱子名称</label>
                    <input type="text" class="form-input" id="sheetTitle" placeholder="例如：小星星谱子">
                </div>
                <div class="form-group">
                    <label class="form-label">日期</label>
                    <input type="date" class="form-input" id="sheetDate">
                </div>
                <div class="form-group">
                    <label class="form-label">备注</label>
                    <textarea class="form-textarea" id="sheetContent" placeholder="谱子备注..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">上传谱子图片</label>
                    <div class="upload-area" onclick="document.getElementById('sheetFile').click()">
                        <div class="upload-icon">📷</div>
                        <div class="upload-text">点击上传谱子图片</div>
                        <div class="upload-hint">支持 JPG、PNG 格式</div>
                    </div>
                    <input type="file" id="sheetFile" accept="image/*" class="hidden-input" onchange="previewSheetFile(this)">
                    <div id="sheetPreview" style="margin-top:10px;text-align:center;"></div>
                </div>
                <button class="submit-btn" onclick="saveSheet()">保存</button>
            </div>
            <div id="videoForm" style="display:none;">
                <div class="form-group">
                    <label class="form-label">视频名称</label>
                    <input type="text" class="form-input" id="videoTitle" placeholder="例如：小星星伴奏视频">
                </div>
                <div class="form-group">
                    <label class="form-label">描述</label>
                    <textarea class="form-textarea" id="videoDesc" placeholder="视频描述..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">上传视频</label>
                    <div class="upload-area" onclick="document.getElementById('videoFile').click()">
                        <div class="upload-icon">🎬</div>
                        <div class="upload-text">点击上传伴奏视频</div>
                        <div class="upload-hint">支持 MP4、MOV 格式</div>
                    </div>
                    <input type="file" id="videoFile" accept="video/*" class="hidden-input" onchange="previewVideoFile(this)">
                    <div id="videoPreview" style="margin-top:10px;"></div>
                </div>
                <button class="submit-btn" onclick="saveVideo()">保存</button>
            </div>
            <div id="audioForm" style="display:none;">
                <div class="form-group">
                    <label class="form-label">音频名称</label>
                    <input type="text" class="form-input" id="audioTitle" placeholder="例如：小星星伴奏音频">
                </div>
                <div class="form-group">
                    <label class="form-label">描述</label>
                    <textarea class="form-textarea" id="audioDesc" placeholder="音频描述..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">上传音频</label>
                    <div class="upload-area" onclick="document.getElementById('audioFile').click()">
                        <div class="upload-icon">🎧</div>
                        <div class="upload-text">点击上传伴奏音频</div>
                        <div class="upload-hint">支持 MP3、WAV、M4A 格式</div>
                    </div>
                    <input type="file" id="audioFile" accept="audio/*" class="hidden-input" onchange="previewAudioFile(this)">
                    <div id="audioPreview" style="margin-top:10px;"></div>
                </div>
                <button class="submit-btn" onclick="saveAudio()">保存</button>
            </div>
        </div>
    </div>

    <!-- 谱子查看器 -->
    <div class="sheet-viewer" id="sheetViewer">
        <button class="sheet-viewer-close" onclick="closeSheetViewer()">✕</button>
        <img id="sheetViewerImg" src="" alt="谱子">
    </div>

    <!-- 导入文件 -->
    <input type="file" id="importFile" accept=".csv,.txt" class="hidden-input" onchange="importLessons(this)">

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // Supabase 配置
        const SUPABASE_URL = 'https://ixldmkdcnhejmtjpgawm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ntl8P9fwJxo3QAf_EkqAnQ_nD8KJEkq';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 数据
        let lessons = [];
        let sheets = [];
        let videos = [];
        let audios = [];
        let currentTab = 'lessons';
        let editingId = null;
        let dataLoaded = false;
        let selectedSheetFile = null;
        let selectedVideoFile = null;
        let selectedAudioFile = null;

        // 谱子缩放
        let scale = 1;
        let lastTouchDist = 0;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('lessonDate').value = today;
            document.getElementById('sheetDate').value = today;
            loadAllData();
        });

        async function loadAllData() {
            // 显示加载状态
            document.getElementById('lessonList').innerHTML = '<div class="loading-state"><div class="loading-spinner"></div><div class="empty-text">正在从云端加载数据...</div></div>';
            
            // 15秒超时机制
            const timeoutPromise = new Promise((_, reject) => {
                setTimeout(() => reject(new Error('连接超时（15秒无响应）。可能原因：1.网络不好 2.Supabase项目还在启动 3.API key不正确')), 15000);
            });
            
            try {
                // 测试Supabase连接

        // 双指缩放
        document.getElementById('sheetViewerImg').addEventListener('touchstart', function(e) {
            if (e.touches.length === 2) {
                lastTouchDist = getTouchDist(e);
            }
        });

        document.getElementById('sheetViewerImg').addEventListener('touchmove', function(e) {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dist = getTouchDist(e);
                const ratio = dist / lastTouchDist;
                scale = Math.max(0.5, Math.min(5, scale * ratio));
                this.style.transform = `scale(${scale})`;
                lastTouchDist = dist;
            }
        }, { passive: false });

        // 双击放大/还原
        document.getElementById('sheetViewerImg').addEventListener('dblclick', function() {
            if (scale > 1) {
                scale = 1;
            } else {
                scale = 2;
            }
            this.style.transform = `scale(${scale})`;
        });

        function getTouchDist(e) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // 导入导出
        function exportLessons() {
            if (lessons.length === 0) { showToast('没有数据可导出'); return; }
            const headers = ['日期', '课程标题', '课程内容', '课后作业', '标签'];
            const rows = lessons.map(l => [l.date || '', l.title || '', l.content || '', l.homework || '', l.tags || '']);
            const csv = [headers, ...rows].map(row => row.map(cell => `"${(cell || '').replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `课程记录_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('导出成功！');
        }

        async function importLessons(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const text = e.target.result;
                    const lines = text.split(/\r?\n/).filter(line => line.trim());
                    if (lines.length < 2) { showToast('文件格式不正确'); return; }
                    
                    // 解析CSV（支持引号）
                    const parseCSV = (line) => {
                        const result = [];
                        let current = '';
                        let inQuotes = false;
                        for (let i = 0; i < line.length; i++) {
                            const char = line[i];
                            if (char === '"') {
                                if (inQuotes && line[i + 1] === '"') {
                                    current += '"';
                                    i++;
                                } else {
                                    inQuotes = !inQuotes;
                                }
                            } else if (char === ',' && !inQuotes) {
                                result.push(current);
                                current = '';
                            } else {
                                current += char;
                            }
                        }
                        result.push(current);
                        return result;
                    };

                    const headers = parseCSV(lines[0]);
                    const imported = [];
                    for (let i = 1; i < lines.length; i++) {
                        const cells = parseCSV(lines[i]);
                        const record = {
                            date: cells[0] || '',
                            title: cells[1] || '',
                            content: cells[2] || '',
                            homework: cells[3] || '',
                            tags: cells[4] || ''
                        };
                        // 空字段也允许导入
                        imported.push(record);
                    }

                    if (imported.length === 0) { showToast('没有可导入的数据'); return; }

                    // 批量插入
                    const { error } = await supabase.from('lessons').insert(imported);
                    if (error) throw error;

                    showToast(`成功导入 ${imported.length} 条记录！`);
                    await loadAllData();
                } catch(e) {
                    showToast('导入失败：' + e.message);
                }
                input.value = '';
            };
            reader.readAsText(file, 'UTF-8');
        }

        // Toast
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
